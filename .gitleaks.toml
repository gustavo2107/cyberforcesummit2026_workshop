# Configuración de gitleaks para el repositorio del taller.
#
# Se extiende la configuración por defecto, que ya cubre las familias que
# importan aquí: tokens de GitHub (ghp_, github_pat_), llaves de AWS, llaves
# privadas SSH/PGP y credenciales genéricas en asignaciones.
#
# El riesgo concreto de este repositorio es setup/mcp-config.example.json: es
# el archivo que se edita al fijar el MCP, y donde es fácil dejar un token real
# en lugar del marcador de posición.
#
# IMPORTANTE — gitleaks usa RE2 (Go), que NO soporta lookahead ni lookbehind.
# Una expresión con (?!...) o (?<=...) no da error de validación: hace que
# gitleaks entre en pánico al arrancar, y el hook falla en cada commit.
# Si agregas reglas, pruébalas con:
#     gitleaks detect --config .gitleaks.toml --no-git
#
# La detección de correos personales NO se hace aquí, precisamente porque
# requeriría un lookahead para excluir las direcciones noreply. Vive en
# .githooks/pre-commit, donde `grep -v` resuelve la exclusión sin lookahead.

title = "Taller CyberForce Summit 2026"

[extend]
useDefault = true

[[rules]]
id = "token-github-explicito"
description = "Token de GitHub (classic o fine-grained)"
regex = '''(ghp_[A-Za-z0-9]{36}|github_pat_[A-Za-z0-9_]{22,})'''
tags = ["github", "token"]

[allowlist]
description = "Excepciones legitimas del taller"
paths = [
  '''docs/.*\.md''',
  '''NOTICE\.md''',
  '''README\.md''',
  '''CHANGELOG\.md''',
  '''evidence/datos-sinteticos/.*''',
]
